<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Final3 Einlass</title>
<link rel="icon" href="/img/logo.png">
<link rel="apple-touch-icon" href="/img/logo.png">
<link rel="stylesheet" href="/assets/final3.css">
<style>
html,body{background:var(--black);color:#fff;min-height:100%}
body{overscroll-behavior:none}
.top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:linear-gradient(135deg,var(--black),var(--navy));border-bottom:3px solid var(--red)}
.top .t{flex:1;min-width:0}
.top b{display:block;font-size:16px}
.top small{opacity:.8;font-size:12px}
.pill{font-size:11px;font-weight:800;letter-spacing:.5px;padding:5px 9px;border-radius:20px;background:rgba(255,255,255,.12)}
.pill.off{background:var(--warn);color:#111}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.stat{background:rgba(255,255,255,.07);border-radius:12px;padding:9px 10px;text-align:center}
.stat .v{font-size:22px;font-weight:800}
.stat .l{font-size:11px;opacity:.75}
.camWrap{position:relative;margin:0 12px;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1/1;max-height:62vh}
#reader{width:100%;height:100%}
#reader video{object-fit:cover!important;width:100%!important;height:100%!important}
#reader img[alt="Info icon"],#reader img[alt="Camera based scan"]{display:none!important}
.frame{position:absolute;inset:12%;border:4px solid rgba(255,255,255,.85);border-radius:18px;pointer-events:none;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.camMsg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.btn{border:0;border-radius:12px;padding:15px 22px;font-size:17px;font-weight:800;background:var(--red);color:#fff;cursor:pointer}
.btn.sec{background:rgba(255,255,255,.14);color:#fff}
.btn.light{background:#fff;color:#111}
.btn:disabled{opacity:.5}
.manual{display:flex;gap:8px;padding:12px}
.manual input{flex:1;min-width:0;padding:13px;border-radius:12px;border:0;font-size:17px;font-family:"Courier New",monospace;text-transform:uppercase;letter-spacing:1px}
.foot{padding:4px 14px calc(16px + env(safe-area-inset-bottom));font-size:12px;opacity:.6;text-align:center}
.res{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;color:#fff}
.res .ic{font-size:96px;line-height:1}
.res .big{font-size:36px;font-weight:900;margin:10px 0 4px;letter-spacing:.5px}
.res .sub{font-size:18px;opacity:.95}
.res .info{background:rgba(255,255,255,.16);border-radius:14px;padding:14px 18px;margin-top:20px;font-size:17px;line-height:1.5;max-width:440px;width:100%}
.res .vip{display:inline-block;background:#000;color:#f5c542;border:2px solid #f5c542;border-radius:10px;padding:4px 14px;font-weight:900;letter-spacing:3px;margin-bottom:8px}
.res .acts{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;justify-content:center}
.pair{max-width:440px;margin:30px auto;padding:0 16px;text-align:center}
.pair h1{font-size:24px}
.pair input{width:100%;padding:15px;border-radius:12px;border:0;font-size:22px;text-align:center;font-family:"Courier New",monospace;letter-spacing:3px;text-transform:uppercase;margin:12px 0}
.pair p{opacity:.85;line-height:1.5}
.check{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-size:22px;font-weight:700}
</style>
</head>
<body>
<div id="app"><div class="load" style="color:#fff">⏳ Starte Scanner …</div></div>
<div id="overlay"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/html5-qrcode.min.js"></script>
<script src="/assets/common.js"></script>
<script>
const $ = F3.$, esc = F3.esc, toast = F3.toast;
const KEY = 'f3.scan', QKEY = 'f3.scan.queue', LKEY = 'f3.scan.list';
let DEV = load(KEY), STATS = {}, scanner = null, busy = false, last = { t: '', at: 0 };
let online = true, LIST = load(LKEY), QUEUE = load(QKEY) || [], wakeLock = null, audio = null;

function load(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function save(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

/* ---------------- Ton & Vibration ---------------- */
function beep(ok) {
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[880, 0, .12]] : [[220, 0, .18], [220, .25, .18]];
    tones.forEach(([f, d, l]) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = f; o.type = ok ? 'sine' : 'square';
      g.gain.value = .25; o.connect(g); g.connect(audio.destination);
      o.start(audio.currentTime + d); o.stop(audio.currentTime + d + l);
    });
  } catch (e) {}
  if (navigator.vibrate) navigator.vibrate(ok ? 80 : [200, 100, 200]);
}

/* ---------------- Kopplung ---------------- */
function viewPair(msg) {
  stopCam();
  $('#app').innerHTML = `
  <div class="top"><div class="t"><b>Final3 Einlass</b><small>Gerät nicht gekoppelt</small></div></div>
  <form class="pair" id="pairForm">
    <h1>📱 Gerät koppeln</h1>
    <p>Im Admin unter <b>Einlass › Gerät koppeln</b> den Kopplungs-QR mit der Handykamera scannen – oder den 12-stelligen Code hier eingeben.</p>
    <input id="pairCode" placeholder="XXXX XXXX XXXX" autocomplete="off" autocapitalize="characters" aria-label="Kopplungscode">
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn" style="width:100%;margin-top:10px" type="submit">Koppeln</button>
  </form>`;
  $('#pairForm').addEventListener('submit', e => { e.preventDefault(); pair($('#pairCode').value); });
}
async function pair(code) {
  try {
    const r = await F3.rpc('f3_scan_pair', { p_pair: code });
    DEV = { token: r.token, name: r.name, event: r.event };
    save(KEY, DEV);
    history.replaceState(null, '', '/scan');
    toast('✓ Gerät „' + r.name + '“ gekoppelt');
    start();
  } catch (e) { viewPair(e.message); }
}

/* ---------------- Hauptansicht ---------------- */
function viewMain() {
  $('#app').innerHTML = `
  <div class="top">
    <div class="t"><b>${esc(DEV.event || 'Final3')} · Einlass</b><small>Gerät: ${esc(DEV.name)}</small></div>
    <span class="pill ${online ? '' : 'off'}" id="net">${online ? 'ONLINE' : 'OFFLINE'}</span>
  </div>
  <div class="stats">
    <div class="stat"><div class="v" id="sHeute">${STATS.heute ?? '–'}</div><div class="l">Einlässe heute</div></div>
    <div class="stat"><div class="v" id="sGeraet">${STATS.geraet ?? '–'}</div><div class="l">dieses Gerät</div></div>
    <div class="stat"><div class="v" id="sErw">${STATS.erwartet ?? '–'}</div><div class="l">noch erwartet</div></div>
  </div>
  <div class="camWrap"><div id="reader"></div><div class="frame" id="frame" hidden></div>
    <div class="camMsg" id="camMsg"><div style="font-size:54px">📷</div><button class="btn" type="button" onclick="startCam()">Kamera starten</button>
      <div style="font-size:13px;opacity:.75">Beim ersten Mal den Kamerazugriff erlauben.</div></div>
  </div>
  <form class="manual" id="manForm">
    <input id="manCode" placeholder="Code manuell" autocomplete="off" autocapitalize="characters" aria-label="Ticketcode manuell">
    <button class="btn sec" type="submit">Prüfen</button>
  </form>
  <div class="foot"><span id="qinfo"></span> Offline-Liste: <span id="linfo">${LIST ? LIST.stand + ' Uhr' : '–'}</span> ·
    <a href="#" style="color:#fff" onclick="unpair();return false">Gerät abmelden</a></div>`;
  $('#manForm').addEventListener('submit', e => { e.preventDefault(); const v = $('#manCode').value.trim(); $('#manCode').value = ''; if (v) handle(v, false); });
  updateInfo();
}
function updateInfo() {
  const n = $('#net'); if (n) { n.textContent = online ? 'ONLINE' : 'OFFLINE'; n.className = 'pill' + (online ? '' : ' off'); }
  const q = $('#qinfo'); if (q) q.textContent = QUEUE.length ? QUEUE.length + ' Offline-Einlässe warten auf Abgleich ·' : '';
  const l = $('#linfo'); if (l) l.textContent = LIST ? LIST.stand + ' Uhr' : '–';
  if (STATS.heute != null) { $('#sHeute').textContent = STATS.heute; $('#sGeraet').textContent = STATS.geraet; $('#sErw').textContent = STATS.erwartet; }
}
function unpair() {
  if (!confirm('Dieses Gerät abmelden? Danach muss es neu gekoppelt werden.')) return;
  save(KEY, null); save(LKEY, null); DEV = null; LIST = null; viewPair();
}

/* ---------------- Kamera ---------------- */
async function startCam() {
  if (scanner) return;
  try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch (e) {}
  $('#camMsg').innerHTML = '<div>⏳ Kamera wird gestartet …</div>';
  try {
    scanner = new Html5Qrcode('reader', {
      formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, aspectRatio: 1.0, disableFlip: true },
      text => handle(text, false), () => {});
    $('#camMsg').style.display = 'none'; $('#frame').hidden = false;
  } catch (e) {
    scanner = null;
    $('#camMsg').innerHTML = `<div>⚠️ Kamera nicht verfügbar</div><div style="font-size:13px;opacity:.8">${esc(e && e.message ? e.message : String(e))}<br>Kamerazugriff in den Browser-Einstellungen erlauben.</div><button class="btn" type="button" onclick="startCam()">Erneut versuchen</button>`;
  }
}
function stopCam() { if (scanner) { scanner.stop().catch(() => {}); scanner = null; } }
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && wakeLock !== null && 'wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
});

/* ---------------- Prüfung ---------------- */
function normalize(raw) {
  let s = String(raw || '').trim();
  if (/^F3:/i.test(s)) s = s.slice(3);
  else { const m = s.match(/[?&]t=([A-Za-z0-9]+)/i); if (m) s = m[1]; }
  return s.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
}
async function handle(raw, force) {
  const now = Date.now();
  if (busy) return;
  if (!force && raw === last.t && now - last.at < 3000) return;
  last = { t: raw, at: now };
  busy = true;
  $('#overlay').innerHTML = '<div class="check">⏳ Prüfe …</div>';
  let r;
  try {
    r = await F3.rpc('f3_scan_checkin', { p_token: DEV.token, p_code: raw, p_force: !!force }, { timeout: 6000 });
    if (r.stats) STATS = r.stats;
    setOnline(true);
  } catch (e) {
    if (e.auth) { busy = false; $('#overlay').innerHTML = ''; save(KEY, null); DEV = null; return viewPair(e.message); }
    if (e.offline) { setOnline(false); r = await offlineCheck(raw, force); }
    else r = { result: 'NEIN', text: 'FEHLER', sub: e.message };
  }
  showResult(r, raw);
}
function showResult(r, raw) {
  const ok = r.result === 'OK', tag = r.result === 'TAG';
  beep(ok);
  const bg = ok ? 'var(--ok)' : tag ? 'var(--warn)' : 'var(--bad)';
  const info = r.taname ? `<div class="info">${r.vip ? '<div class="vip">VIP</div><br>' : ''}<b style="font-size:21px">${esc(r.taname)}</b><br>${esc(r.alname || '')}${r.aufdruck && !['Eintrittskarte', 'VIP'].includes(r.aufdruck) ? ' · ' + esc(r.aufdruck) : ''}
    ${r.name ? `<br><span style="opacity:.85">${esc(r.name)}${r.kategorie ? ' · ' + esc(r.kategorie) : ''}</span>` : ''}
    ${r.extras ? `<br>✨ ${esc(r.extras)}` : ''}</div>` : '';
  const acts = tag
    ? `<div class="acts"><button class="btn light" type="button" onclick="forceIn()">Trotzdem einlassen</button><button class="btn sec" type="button" onclick="closeRes()">Abbrechen</button></div>`
    : `<div class="acts"><button class="btn sec" type="button" onclick="closeRes()">Weiter scannen</button></div>`;
  $('#overlay').innerHTML = `<div class="res" style="background:${bg}" onclick="if(event.target===this)closeRes()">
    <div class="ic">${ok ? '✅' : tag ? '⚠️' : '❌'}</div><div class="big">${esc(r.text)}</div><div class="sub">${esc(r.sub || '')}</div>${info}${acts}
    ${r.offline ? '<div style="margin-top:14px;font-size:13px;opacity:.9">Offline geprüft – wird automatisch abgeglichen</div>' : ''}</div>`;
  window._pendingForce = tag ? raw : null;
  updateInfo();
  clearTimeout(window._resT);
  if (!tag) window._resT = setTimeout(closeRes, ok ? 1800 : 2600);
}
function closeRes() { clearTimeout(window._resT); $('#overlay').innerHTML = ''; busy = false; }
function forceIn() { const raw = window._pendingForce; closeRes(); if (raw) handle(raw, true); }

/* ---------------- Offline-Betrieb ---------------- */
async function sha(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
}
async function offlineCheck(raw, force) {
  const code = normalize(raw);
  if (!LIST || !LIST.tickets) return { result: 'NEIN', text: 'KEINE VERBINDUNG', sub: 'Offline-Liste fehlt – Code notieren oder manuell prüfen' };
  const h = await sha(code);
  const row = LIST.tickets.find(t => t[0] === h);
  if (!row) return { result: 'NEIN', text: 'UNGÜLTIG', sub: 'Nicht in der Offline-Liste', offline: true };
  const info = { taname: row[1], alname: row[2], vip: row[3], offline: true };
  if (row[6] || QUEUE.some(q => q.code === code)) return { ...info, result: 'NEIN', text: 'BEREITS EINGELÖST', sub: 'laut Offline-Liste' };
  if (!row[5] && !force) return { ...info, result: 'TAG', text: 'NICHT FÜR HEUTE', sub: 'laut Offline-Liste' };
  QUEUE.push({ code, ts: new Date().toISOString() });
  row[6] = true;
  save(QKEY, QUEUE); save(LKEY, LIST);
  return { ...info, result: 'OK', text: row[3] ? 'VIP · GÜLTIG' : 'GÜLTIG', sub: row[4] ? 'Kind – nur mit Begleitung' : '' };
}
function setOnline(v) { if (online !== v) { online = v; updateInfo(); } }
async function refreshList() {
  if (!DEV) return;
  try {
    const l = await F3.rpc('f3_scan_offline', { p_token: DEV.token }, { timeout: 20000 });
    LIST = l; save(LKEY, LIST); setOnline(true); updateInfo();
  } catch (e) { if (e.offline) setOnline(false); }
}
async function syncQueue() {
  if (!DEV || !QUEUE.length) return;
  const batch = QUEUE.slice(0, 50);
  try {
    const r = await F3.rpc('f3_scan_sync', { p_token: DEV.token, p_entries: batch }, { timeout: 15000 });
    QUEUE = QUEUE.slice(batch.length); save(QKEY, QUEUE);
    if (r.stats) STATS = r.stats;
    setOnline(true); updateInfo();
    if (r.konflikte) toast('⚠️ ' + r.konflikte + ' Offline-Einlass(e) waren doppelt – im Admin-Protokoll vermerkt');
  } catch (e) { if (e.offline) setOnline(false); }
}

/* ---------------- Start ---------------- */
async function start() {
  if (!DEV) return viewPair();
  try {
    const h = await F3.rpc('f3_scan_hello', { p_token: DEV.token }, { timeout: 8000 });
    DEV.name = h.name; DEV.event = h.event; save(KEY, DEV); STATS = h.stats || {};
    online = true;
  } catch (e) {
    if (e.auth) { save(KEY, null); DEV = null; return viewPair(e.message); }
    online = false;
  }
  viewMain();
  refreshList(); syncQueue();
  try {
    const perm = navigator.permissions && await navigator.permissions.query({ name: 'camera' });
    if (perm && perm.state === 'granted') startCam();
  } catch (e) {}
}
setInterval(refreshList, 5 * 60 * 1000);
setInterval(syncQueue, 20 * 1000);
window.addEventListener('online', () => { syncQueue(); refreshList(); });

const pm = location.hash.match(/pair=([A-Za-z0-9]+)/);
if (pm) pair(pm[1]); else start();
</script>
</body>
</html>
