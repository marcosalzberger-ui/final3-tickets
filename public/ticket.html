<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Meine Tickets</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/assets/final3.css">
<style>
.top{background:var(--black);height:64px;display:flex;align-items:center;padding:0 18px;border-bottom:4px solid var(--red)}
.logo{background:#fff;border-radius:10px;padding:5px 12px;display:inline-flex;align-items:center;height:46px}
.logo img{height:36px;width:auto;display:block}
.logo b{color:var(--navy);font-size:18px;letter-spacing:.5px}
main{max-width:560px;margin:auto;padding:18px 14px 40px}
.head h1{margin:6px 0 2px;font-size:24px;color:var(--navy)}
.head .hint{color:var(--mut);font-size:14px}
.tk{background:#fff;border-radius:16px;box-shadow:0 2px 10px rgba(15,25,45,.1);overflow:hidden;margin:14px 0}
.tk .band{color:#fff;padding:12px 16px}
.tk .lab{display:inline-block;background:var(--red);font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border-radius:4px}
.tk .name{font-size:21px;font-weight:800;text-transform:uppercase;margin-top:6px;line-height:1.1}
.tk .sub{opacity:.9;font-size:14px;margin-top:3px}
.tk .body{padding:16px;text-align:center}
.tk .qr{display:inline-block;background:#fff;padding:8px;border-radius:12px;border:1px solid #e4e8ef;width:100%;max-width:300px}
.tk .qr svg{display:block;width:100%;height:auto}
.tk .code{font-family:"Courier New",monospace;font-weight:700;letter-spacing:3px;font-size:17px;margin-top:8px}
.tk .meta{color:var(--mut);font-size:13px;margin-top:6px;line-height:1.5}
.badge{display:inline-block;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:#e9edf4;color:var(--navy)}
.badge.ok{background:#dcf2e4;color:#14723d}.badge.warn{background:#fff0d3;color:#9c6200}.badge.bad{background:#f8dcda;color:#aa2c22}
.note{background:#fff;border-left:5px solid var(--red);border-radius:8px;padding:12px 16px;font-size:14px;line-height:1.5;margin-top:14px}
</style>
</head>
<body>
<div class="top"><span class="logo" id="logo"><b>FINAL3</b></span></div>
<main id="app"><div class="load">⏳ Lade Tickets …</div></main>
<script src="/assets/qr.js"></script>
<script src="/assets/common.js"></script>
<script>
const $ = F3.$, esc = F3.esc;
(function () { const i = new Image(); i.alt = 'Final3'; i.onload = () => { $('#logo').innerHTML = ''; $('#logo').appendChild(i); }; i.src = '/img/logo.png'; })();

async function load() {
  const token = (location.hash || '').replace(/^#/, '').trim();
  if (!token) { $('#app').innerHTML = '<div class="err">Ungültiger Ticket-Link.</div>'; return; }
  try {
    const r = await F3.rpc('f3_ticket_view', { p_token: token });
    if (!r.ok) { $('#app').innerHTML = `<div class="err">${esc(r.text)}</div>`; return; }
    document.title = r.event + ' – Meine Tickets';
    const open = r.status === 'OFFEN';
    $('#app').innerHTML = `
    <div class="head">
      <h1>${esc(r.event)}</h1>
      <div class="hint">Bestellung ${esc(r.nr)} · ${esc(r.name)}</div>
    </div>
    ${open ? '<div class="note">Die Zahlung ist noch nicht eingegangen. Die QR-Codes erscheinen hier, sobald die Zahlung verbucht ist.</div>' : ''}
    ${r.status === 'STORNIERT' || r.status === 'ABGELAUFEN' ? `<div class="err">Diese Bestellung ist ${esc(r.status.toLowerCase())}.</div>` : ''}
    ${r.tickets.map((t, i) => `
    <div class="tk">
      <div class="band" style="background:${/^#[0-9a-f]{6}$/i.test(t.farbe) ? t.farbe : 'var(--navy)'}">
        <span class="lab">${esc(r.quelle === 'Freikarte' && t.aufdruck === 'Eintrittskarte' ? 'Freikarte' : t.aufdruck)}</span>
        <div class="name">${esc(t.taname)}</div>
        <div class="sub">${esc(t.alname)} · ${esc(t.preis)} · ${esc(t.tage)}</div>
      </div>
      <div class="body">
        ${t.code ? `<div class="qr">${F3QR.svg('F3:' + t.code)}</div><div class="code">${esc(t.code)}</div>`
                 : `<span class="badge ${t.status === 'RESERVIERT' ? 'warn' : 'bad'}">${t.status === 'RESERVIERT' ? 'Zahlung ausstehend' : esc(t.status)}</span>`}
        <div class="meta">${t.eingelassen ? '<span class="badge ok">Heute bereits eingelassen</span><br>' : ''}
          ${t.extras ? 'Inklusive: ' + esc(t.extras) + '<br>' : ''}Ticket ${i + 1}/${r.tickets.length}</div>
      </div>
    </div>`).join('')}
    <div class="note">${esc(r.einlass || '')}${r.adresse ? ' · ' + esc(r.adresse) : esc(r.ort ? ' · ' + r.ort : '')}<br>
      Tipp: Displayhelligkeit beim Einlass hochdrehen. Jeder Code ist pro Veranstaltungstag einmal gültig – bitte nicht weitergeben.</div>`;
  } catch (e) {
    $('#app').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
load();
window.addEventListener('hashchange', load);
</script>
</body>
</html>
