<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Meine Tickets</title>
<link rel="icon" href="/img/logo.png">
<link rel="stylesheet" href="/assets/final3.css">
<style>
:root{--tnavy:#14284b;--tred:#e30613;--tline:#d9dee7}
body{background:#eef1f5}
main{max-width:980px;margin:auto;padding:18px 12px 30px}
.head h1{margin:4px 0 2px;font-size:22px;color:var(--tnavy)}
.head .hint{color:#5b6577;font-size:14px}
.note{background:#fff;border-left:5px solid var(--tred);border-radius:8px;padding:12px 16px;font-size:14px;line-height:1.5;margin:14px 0}
.err{background:#fde8e6;color:#a3261b;border-radius:8px;padding:12px 16px;margin:14px 0}

/* ---------- Ticket ---------- */
.tk{display:flex;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 4px 18px rgba(20,40,75,.15);margin:18px 0;color:var(--tnavy)}
.tk .main{flex:1;min-width:0;display:flex;flex-direction:column}
.tk .top{display:flex;gap:18px;padding:22px 26px 14px;align-items:flex-start}
.tk .kicker{font-size:11px;letter-spacing:4px;font-weight:600;color:#5b6577;text-transform:uppercase}
.tk .brand{display:flex;align-items:center;gap:18px;margin-top:8px}
.tk .f3logo{height:92px;width:auto;display:block}
.tk .f3txt{font-weight:900;font-style:italic;line-height:.92;font-size:44px;letter-spacing:-1px}
.tk .f3txt span{color:var(--tred)}
.tk .when{border-left:2px solid var(--tnavy);padding-left:16px;font-weight:800;font-size:22px;line-height:1.15;text-transform:uppercase}
.tk .when small{display:block;font-size:15px;font-weight:700;margin-top:8px}
.tk .club{margin-left:auto;text-align:center;font-size:12.5px;color:#333;flex:0 0 120px}
.tk .club img{height:84px;width:auto;display:block;margin:0 auto 6px}
.tk .rule{height:2px;background:var(--tred);margin:0 26px}
.tk .feat{display:flex;gap:26px;padding:14px 26px 18px;flex-wrap:wrap}
.tk .feat div{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:700;text-transform:uppercase;line-height:1.2}
.tk .feat svg{width:30px;height:30px;fill:var(--tnavy)}
.tk .spons{margin-top:auto;background:var(--tnavy);padding:16px 26px;display:flex;gap:12px}
.tk .spons .sl{flex:1;background:#fff;border-radius:3px;height:56px;display:flex;align-items:center;justify-content:center;padding:6px}
.tk .spons img{max-width:100%;max-height:100%;object-fit:contain}
/* Abriss */
.tk .stub{flex:0 0 200px;border-left:2px dashed var(--tline);position:relative;display:flex;flex-direction:column;text-align:center}
.tk .stub:before,.tk .stub:after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:#eef1f5}
.tk .stub:before{top:-10px}.tk .stub:after{bottom:-10px}
.tk .si{padding:18px 14px 12px;flex:1}
.tk .typ{font-weight:900;font-size:17px;text-transform:uppercase}
.tk .sub{color:var(--tred);font-weight:700;font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-top:3px}
.tk .qr{width:130px;margin:12px auto 8px}
.tk .qr svg{display:block;width:100%;height:auto}
.tk .pend{display:inline-block;margin:30px 0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;background:#fff0d3;color:#9c6200}
.tk .pend.bad{background:#f8dcda;color:#aa2c22}
.tk .ein{font-weight:700;font-size:13px;margin-top:4px}
.tk .nm{font-size:12.5px;margin-top:10px;text-align:left;padding-left:8px}
.tk .nm b{display:block;font-size:13.5px}
.tk .code{font-family:"Courier New",monospace;font-weight:700;font-size:13px;margin-top:10px}
.tk .cnt{font-size:12.5px}
.tk .ok{display:inline-block;margin-top:6px;background:#dcf2e4;color:#14723d;border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.tk .claim{background:var(--tnavy);color:#fff;font-weight:900;font-style:italic;text-transform:uppercase;font-size:17px;line-height:1.05;padding:16px 12px}
.tk .claim span{display:block;width:60px;height:3px;background:var(--tred);margin:5px auto 0;transform:skewX(-20deg)}

@media(max-width:760px){
  .tk{flex-direction:column}
  .tk .top{flex-wrap:wrap;padding:18px 16px 12px}
  .tk .brand{flex-wrap:wrap;gap:12px}
  .tk .f3logo{height:64px}
  .tk .f3txt{font-size:32px}
  .tk .when{font-size:18px}
  .tk .club{margin-left:0;flex:1 1 100%;display:flex;align-items:center;gap:10px;text-align:left}
  .tk .club img{height:48px;margin:0}
  .tk .rule{margin:0 16px}
  .tk .feat{padding:12px 16px;gap:14px}
  .tk .spons{padding:12px 16px;flex-wrap:wrap}
  .tk .spons .sl{flex:1 1 28%;height:44px}
  .tk .stub{flex:none;border-left:0;border-top:2px dashed var(--tline)}
  .tk .stub:before{top:-11px;left:-10px}.tk .stub:after{top:-11px;bottom:auto;left:auto;right:-10px}
  .tk .qr{width:210px}
  .tk .nm{text-align:center;padding:0}
}
@media print{body{background:#fff}.note,.head,footer{display:none}.tk{box-shadow:none;border:1px solid #ccc;break-inside:avoid}}
footer{text-align:center;font-size:12.5px;color:#5b6577;padding:6px 14px 30px;line-height:1.7}
footer a{color:inherit}
</style>
</head>
<body>
<main id="app"><div class="load">⏳ Lade Tickets …</div></main>
<footer>
  Veranstalter: SPORTUNION Nußbach · ZVR 327740618 · Wimberg 7, 4542 Nußbach<br>
  <a href="https://union-nussbach.at/impressum/" target="_blank" rel="noopener noreferrer">Impressum</a>
  · <a href="/datenschutz.html" target="_blank" rel="noopener noreferrer">Datenschutz</a>
  · <a href="/agb.html" target="_blank" rel="noopener noreferrer">Ticketbedingungen</a>
</footer>
<script src="/assets/qr.js"></script>
<script src="/assets/common.js"></script>
<script>
const $ = F3.$, esc = F3.esc;

/* ================= HIER ANPASSEN ================= */
const CFG = {
  kicker: 'Österreichische Meisterschaft',
  logoFinal3: '/img/logo.png',          // Final3-Logo
  logoVerein: '/img/nussbach.png',      // Nußbach-Wappen
  veranstalter: 'Union Nußbach',
  sponsoren: [                          // max. 5, leere Einträge werden ausgeblendet
    '/img/sponsor1.png',
    '/img/sponsor2.png',
    '/img/sponsor3.png',
    '/img/sponsor4.png',
    '/img/sponsor5.png'
  ],
  features: [
    ['cup', 'Die besten<br>6 Teams'],
    ['team', 'Herren &amp; Frauen'],
    ['arena', '2 Matches<br>pro Tag']
  ],
  claim: 'Mehr als<br>ein Spiel.'
};
/* ================================================= */

const SVG = {
  cup: '<svg viewBox="0 0 24 24"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm-1 4v1a2 2 0 0 0 1 1.7V7zm11 0v2.7A2 2 0 0 0 18 8V7z"/></svg>',
  team: '<svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="9" r="2.3"/><circle cx="19" cy="9" r="2.3"/><path d="M6 20v-3a6 6 0 0 1 12 0v3zM0 20v-2a4 4 0 0 1 5-4 7 7 0 0 0-1 3v3zm24 0h-4v-3a7 7 0 0 0-1-3 4 4 0 0 1 5 4z"/></svg>',
  arena: '<svg viewBox="0 0 24 24"><path d="M2 10c0-2 4.5-3.5 10-3.5S22 8 22 10v8c0 1.5-4.5 3-10 3S2 19.5 2 18zM5 4h2v3H5zm6-2h2v4h-2zm6 2h2v3h-2z"/></svg>'
};

/* Bild nur anzeigen, wenn es existiert */
const img = (src, cls, alt) => src ? `<img class="${cls || ''}" src="${esc(src)}" alt="${esc(alt || '')}" onerror="this.remove()">` : '';

function fmtTage(s) {
  /* "19.02.2027, 20.02.2027" → "19. – 20. FEB 2027"; sonst Originaltext */
  const M = ['JAN','FEB','MÄR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DEZ'];
  const ds = String(s || '').match(/\d{1,2}\.\d{1,2}\.\d{4}/g);
  if (!ds) return esc(s || '');
  const p = ds.map(d => d.split('.').map(Number));
  const a = p[0], b = p[p.length - 1];
  if (p.length === 1) return `${a[0]}. ${M[a[1]-1]} ${a[2]}`;
  return a[1] === b[1] ? `${a[0]}. – ${b[0]}.<br>${M[a[1]-1]} ${a[2]}` : `${a[0]}. ${M[a[1]-1]} –<br>${b[0]}. ${M[b[1]-1]} ${b[2]}`;
}

function vTicket(r, t, i) {
  const label = (r.quelle === 'Freikarte' && t.aufdruck === 'Eintrittskarte') ? 'Freikarte' : (t.preis && /gratis|0,00/i.test(t.preis) ? 'Freikarte' : t.aufdruck || '');
  const spons = CFG.sponsoren.filter(Boolean).slice(0, 5);
  return `
<div class="tk">
  <div class="main">
    <div class="top">
      <div>
        <div class="kicker">${esc(CFG.kicker)}</div>
        <div class="brand">
          ${CFG.logoFinal3 ? `<img class="f3logo" src="${esc(CFG.logoFinal3)}" alt="Faustball Final3"
              onerror="this.outerHTML='<div class=&quot;f3txt&quot;><span>FAUSTBALL</span><br>FINAL3</div>'">` : ''}
          <div class="when">${fmtTage(t.tage)}<small>${esc(r.ort || '')}</small></div>
        </div>
      </div>
      <div class="club">${img(CFG.logoVerein, '', 'Union Nußbach')}<div>Veranstalter:<br>${esc(CFG.veranstalter)}</div></div>
    </div>
    <div class="rule"></div>
    <div class="feat">${CFG.features.map(f => `<div>${SVG[f[0]] || ''}<span>${f[1]}</span></div>`).join('')}</div>
    ${spons.length ? `<div class="spons">${spons.map(s => `<div class="sl">${img(s, '', 'Sponsor')}</div>`).join('')}</div>` : ''}
  </div>
  <div class="stub">
    <div class="si">
      <div class="typ">${esc(t.taname)}</div>
      <div class="sub">${esc(t.alname)}${label ? ' · ' + esc(label) : ''}</div>
      ${t.code
        ? `<div class="qr">${F3QR.svg('F3:' + t.code)}</div>`
        : `<div class="pend ${t.status === 'RESERVIERT' ? '' : 'bad'}">${t.status === 'RESERVIERT' ? 'Zahlung ausstehend' : esc(t.status)}</div>`}
      ${r.einlass ? `<div class="ein">${esc(r.einlass)}</div>` : ''}
      <div class="nm">Name:<b>${esc(r.name)}</b></div>
      <div class="code">${esc(t.code || r.nr)}</div>
      <div class="cnt">Ticket ${i + 1}/${r.tickets.length}</div>
      ${t.extras ? `<div class="cnt">inkl. ${esc(t.extras)}</div>` : ''}
      ${t.eingelassen ? '<div class="ok">Heute bereits eingelassen</div>' : ''}
    </div>
    <div class="claim">${CFG.claim}<span></span></div>
  </div>
</div>`;
}

async function load() {
  const token = (location.hash || '').replace(/^#/, '').trim();
  if (!token) { $('#app').innerHTML = '<div class="err">Ungültiger Ticket-Link.</div>'; return; }
  try {
    const r = await F3.rpc('f3_ticket_view', { p_token: token });
    if (!r.ok) { $('#app').innerHTML = `<div class="err">${esc(r.text)}</div>`; return; }
    document.title = r.event + ' – Meine Tickets';
    const open = r.status === 'OFFEN';
    $('#app').innerHTML = `
    <div class="head">
      <h1>${esc(r.event)}</h1>
      <div class="hint">Bestellung ${esc(r.nr)} · ${esc(r.name)}</div>
    </div>
    ${open ? '<div class="note">Die Zahlung ist noch nicht eingegangen. Die QR-Codes erscheinen hier, sobald die Zahlung verbucht ist.</div>' : ''}
    ${r.status === 'STORNIERT' || r.status === 'ABGELAUFEN' ? `<div class="err">Diese Bestellung ist ${esc(r.status.toLowerCase())}.</div>` : ''}
    ${r.tickets.map((t, i) => vTicket(r, t, i)).join('')}
    <div class="note">${r.adresse ? esc(r.adresse) + '<br>' : ''}
      Tipp: Displayhelligkeit beim Einlass hochdrehen. Jeder Code ist pro Veranstaltungstag einmal gültig – bitte nicht weitergeben.</div>`;
  } catch (e) {
    $('#app').innerHTML = `<div class="err">${esc(e.message)}</div>`;
  }
}
load();
window.addEventListener('hashchange', load);
</script>
</body>
</html>
